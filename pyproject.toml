[project]
name = "robottraderslab-impulse"
version = "0.1.1"
description = "Impulse trading strategy plugin for the RobotTradersLab engine"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
dependencies = [
  "robottraderslab>=0.1.0",
  "pandas>=3.0.0",
]

[project.urls]
Homepage = "https://robottraders.io/lab/impulse"
Documentation = "https://robottraders.io/lab/docs/impulse.html"
Repository = "https://github.com/RobotTraders/RobotTradersLab-Impulse"

[project.entry-points."robot_traders_lab.strategies"]
impulse ="robottraderslab_impulse:ImpulseStrategy"

[project.entry-points."robot_traders_lab.indicators"]
impulse = "robottraderslab_impulse.chart_indicators:get_lightweight_chart_indicators"

[project.entry-points."robot_traders_lab.examples"]
impulse = "robottraderslab_impulse"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"


[tool.uv.build-backend]
module-name = "robottraderslab_impulse"
